name: Build & test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build & test
        run: |
          cmake -S . -B build
          cmake --build build
          ./build/mx25519-tests

      - name: Build & test (sanitizers)
        run: |
          cmake -S . -B build-san -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-san
          ./build-san/mx25519-tests

  linux-emulated:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - 386
          - arm/v7
          - arm64
          - s390x

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build & test
        run: |
          docker run --rm \
            --platform=linux/${{ matrix.arch }} \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src" \
            -w /src \
            debian:stable \
            bash -c "
              apt-get update &&
              apt-get install -y --no-install-recommends \
                build-essential cmake &&
              cmake -S . -B build &&
              cmake --build build &&
              ./build/mx25519-tests
            "

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build & test
        run: |
          cmake -S . -B build
          cmake --build build
          ./build/mx25519-tests

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: .\build\Release\mx25519-tests.exe

  windows-gcc:
    name: Windows (GCC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles"

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: .\build\mx25519-tests.exe
